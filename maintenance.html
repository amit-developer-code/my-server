<!doctype html>
<!--
  maintenance.html - shown by nginx while the app is down (not deployed yet,
  restarting, or crashed). server-setup.sh copies it to /var/www/DOMAIN-static/.

  Must stay fully self-contained (inline CSS + SVG, no external images, CSS,
  scripts or fonts): while the app is down, nginx can serve only this one file.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>We'll be right back</title>
<style>
  :root { --brand: #6170f0; --ink: #1d2033; --muted: #a4a9c4; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: flex; align-items: center; justify-content: center; padding: 24px;
    background: #fff; color: var(--ink); text-align: center;
    font-family: "Nunito", "Segoe UI", system-ui, -apple-system, Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  main { width: 100%; max-width: 560px; }
  svg { display: block; width: 100%; height: auto; margin: 0 auto; }
  h1 { margin: 4px 0 12px; font-size: clamp(24px, 5vw, 34px); font-weight: 800; }
  p { margin: 0 auto 28px; max-width: 380px; color: var(--muted); font-size: 15px; line-height: 1.6; }
  .btn {
    display: inline-block; padding: 12px 36px; border-radius: 999px;
    background: var(--brand); color: #fff; font-weight: 700; font-size: 15px;
    letter-spacing: .05em; text-decoration: none;
    box-shadow: 0 8px 20px rgba(97, 112, 240, .3); transition: transform .15s, box-shadow .15s;
  }
  .btn:hover { transform: translateY(-1px); box-shadow: 0 10px 24px rgba(97, 112, 240, .4); }
</style>
</head>
<body>
<main>
  <svg viewBox="0 0 560 260" role="img" aria-label="Unplugged cable above the number 503">
    <!-- clouds and sparkles -->
    <g fill="#e9ecfc">
      <ellipse cx="88" cy="150" rx="26" ry="11"/><circle cx="80" cy="141" r="11"/><circle cx="96" cy="138" r="13"/>
      <ellipse cx="474" cy="158" rx="28" ry="11"/><circle cx="466" cy="148" r="12"/><circle cx="483" cy="145" r="14"/>
      <ellipse cx="452" cy="58" rx="16" ry="7"/><circle cx="456" cy="52" r="8"/>
    </g>
    <g fill="#c9cff8">
      <circle cx="150" cy="78" r="3"/><circle cx="398" cy="112" r="2.5"/><circle cx="336" cy="18" r="2"/><circle cx="196" cy="128" r="2"/>
    </g>
    <!-- cables -->
    <g fill="none" stroke="#2b2f45" stroke-width="2" stroke-linecap="round">
      <path d="M50 30 C110 30 130 66 182 60 S226 48 240 52"/>
      <path d="M334 52 C370 52 380 28 420 30 S480 44 520 26"/>
    </g>
    <!-- plug (left) and socket (right), unplugged -->
    <g stroke="#2b2f45" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="236" y="42" width="30" height="22" rx="4" fill="#fff"/>
      <path d="M266 47 h12 M266 59 h12"/>
      <rect x="296" y="44" width="10" height="16" rx="2" fill="#fff"/>
      <circle cx="320" cy="52" r="16" fill="#fff"/>
      <circle cx="314" cy="52" r="2" fill="#2b2f45"/><circle cx="326" cy="52" r="2" fill="#2b2f45"/>
    </g>
    <!-- 5 [socket-shaped 0] 3 -->
    <g fill="#6170f0" font-family="'Arial Black', 'Segoe UI', Arial, sans-serif" font-weight="900" font-size="150" text-anchor="middle">
      <text x="160" y="226">5</text>
      <text x="400" y="226">3</text>
    </g>
    <rect x="234" y="114" width="92" height="112" rx="46" fill="#fff" stroke="#6170f0" stroke-width="16"/>
    <rect x="262" y="152" width="9" height="24" rx="4.5" fill="#2b2f45"/>
    <rect x="289" y="152" width="9" height="24" rx="4.5" fill="#2b2f45"/>
    <!-- ground -->
    <g stroke-linecap="round">
      <path d="M90 234 H470" stroke="#d5d9f7" stroke-width="3" stroke-dasharray="14 10"/>
      <path d="M140 248 H420" stroke="#e4e7fb" stroke-width="3" stroke-dasharray="6 12"/>
    </g>
  </svg>
  <h1>We'll be right back</h1>
  <p>This site is being updated or is temporarily unavailable. Please try again in a few minutes.</p>
  <!-- empty href reloads the current page, also without JavaScript -->
  <a class="btn" href="">TRY AGAIN</a>
</main>
</body>
</html>
